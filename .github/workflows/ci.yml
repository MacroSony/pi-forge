name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run verify

  platform-verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run verify

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ordinary jobs cover pinned dev 1.5.0.
          # Compatibility matrix covers the older supported hosts (Pi 1.2 is the floor since Forge 0.6.0).
          - pi-version: "1.2.0"
            typebox-version: "1.3.27"
          - pi-version: "1.3.0"
            typebox-version: "1.3.27"
          - pi-version: "1.4.0"
            typebox-version: "1.3.27"
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Install tested Pi host family
        # Explicit coherent fixtures, not unconstrained fresh consumers. Upstream
        # 1.x carets can otherwise mix codemode/MCP APIs across minor releases.
        # chord has published exact versions for every listed 1.x fixture,
        # including 1.2.0 (even though the 1.2 SDK no longer depends on it).
        run: |
          EXTRA_PINS=""
          case "${{ matrix.pi-version }}" in
            1.*) EXTRA_PINS="@earendil-works/pi-codemode@${{ matrix.pi-version }} @earendil-works/pi-mcp@${{ matrix.pi-version }} @earendil-works/pi-telemetry@${{ matrix.pi-version }} @earendil-works/chord@${{ matrix.pi-version }}" ;;
          esac
          npm install --no-save --package-lock=false \
            @earendil-works/pi-agent-core@${{ matrix.pi-version }} \
            @earendil-works/pi-ai@${{ matrix.pi-version }} \
            @earendil-works/pi-coding-agent@${{ matrix.pi-version }} \
            @earendil-works/pi-tui@${{ matrix.pi-version }} \
            typebox@${{ matrix.typebox-version }} $EXTRA_PINS
          EXPECTED_PI_VERSION=${{ matrix.pi-version }} node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            import { resolveHostFamilyVersion } from "./scripts/packed-versions.ts";
            const expected = process.env.EXPECTED_PI_VERSION;
            assert.equal(resolveHostFamilyVersion(process.cwd()), expected);
            if (expected.startsWith("1.")) for (const name of ["pi-codemode", "pi-mcp", "pi-telemetry", "chord"]) {
              const { version } = JSON.parse(readFileSync(`node_modules/@earendil-works/${name}/package.json`, "utf8"));
              console.log(`${name}@${version}`);
              assert.equal(version, expected);
            }
          '

      - name: Run verification
        env:
          PI_TEST_VERSION: ${{ matrix.pi-version }}
          TYPEBOX_TEST_VERSION: ${{ matrix.typebox-version }}
          # Historical 1.x hosts: pin Pi's own upstream packages in packed consumers too
          # (their caret ranges now resolve to incompatible newer releases).
          PI_TEST_COHERENT_UPSTREAM: "1"
        run: npm run verify

  latest-pi:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Install latest Pi host family
        run: |
          PI_TEST_VERSION=$(npm view @earendil-works/pi-coding-agent version)
          TYPEBOX_TEST_VERSION=$(npm view @earendil-works/pi-coding-agent@"$PI_TEST_VERSION" dependencies.typebox)
          PI_TEST_VERSION="$PI_TEST_VERSION" TYPEBOX_TEST_VERSION="$TYPEBOX_TEST_VERSION" node --input-type=module -e '
            import { resolveTestVersions } from "./scripts/packed-versions.ts";
            resolveTestVersions(process.cwd());
          '
          echo "Resolved latest Pi version: $PI_TEST_VERSION"
          echo "Resolved latest TypeBox version: $TYPEBOX_TEST_VERSION"
          echo "PI_TEST_VERSION=$PI_TEST_VERSION" >> "$GITHUB_ENV"
          echo "TYPEBOX_TEST_VERSION=$TYPEBOX_TEST_VERSION" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false \
            @earendil-works/pi-agent-core@"$PI_TEST_VERSION" \
            @earendil-works/pi-ai@"$PI_TEST_VERSION" \
            @earendil-works/pi-coding-agent@"$PI_TEST_VERSION" \
            @earendil-works/pi-tui@"$PI_TEST_VERSION" \
            typebox@"$TYPEBOX_TEST_VERSION"
      - run: npm run verify
